[project]
name = "docgen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "pillow>=11,<12",
  "markdown-it-py>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"docgen" = [
  "templates/*.html",
  "templates/*/*.html",
  "static/css/*",
  "static/vendor/*",
]
"docgen.templates_catalog" = ["semantic/*.yaml"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
