<section class="space-y-3" id="chat-panel">
  <div>
    <p class="docgen-eyebrow">Помощник</p>
    <h2 class="mt-1 text-lg font-semibold text-[#101828]">Чат правок</h2>
  </div>
  <div class="mb-3 space-y-2" id="chat-messages"></div>
  <form
    class="space-y-2"
    hx-post="/projects/{{ project_id }}/chat"
    hx-target="#chat-messages"
    hx-swap="beforeend"
  >
    <textarea class="min-h-24 w-full rounded-2xl border border-[#d8e1e8] px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#60bcff]" name="message"></textarea>
    <input type="hidden" name="revision" value="{{ revision }}">
    <button class="docgen-primary-button" type="submit">Отправить</button>
  </form>
</section>
