{% if is_active %}
  <button
    class="button primary"
    type="button"
    disabled
    hx-get="/projects/{{ job.project_id }}/exports/{{ job.id }}/status"
    hx-trigger="every 2s"
    hx-target="this"
    hx-swap="outerHTML"
  >
    <span class="button-spinner" aria-hidden="true"></span>
    <span>Формируется…</span>
  </button>
{% elif job.status.value == "succeeded" %}
  {% if job.export_format.value == "html" %}
    <a
      class="button secondary"
      href="/projects/{{ job.project_id }}/exports/{{ job.id }}/open"
      target="_blank"
      rel="noopener"
    >Открыть</a>
    {% if show_html_download | default(false) %}
      <a class="button primary" href="/projects/{{ job.project_id }}/exports/{{ job.id }}/download">
        <span>Скачать</span>
      </a>
    {% endif %}
  {% else %}
  <a class="button primary" href="/projects/{{ job.project_id }}/exports/{{ job.id }}/download">
    <span>Скачать</span>
  </a>
  {% endif %}
{% elif safe_error %}
  <p class="export-error-message">{{ safe_error }}</p>
  <button
    class="button primary"
    type="button"
    hx-post="/projects/{{ job.project_id }}/export"
    hx-include="#export-form"
    hx-target="#export-result"
    hx-swap="innerHTML"
  >Повторить экспорт</button>
{% else %}
  <button class="button secondary" type="button" disabled>Экспорт отменён</button>
{% endif %}
