<div
  id="export-status"
  {% if is_active %}
    hx-get="/projects/{{ job.project_id }}/exports/{{ job.id }}/status"
    hx-trigger="every 2s"
    hx-swap="outerHTML"
  {% endif %}
  aria-live="polite"
>
  {% if is_active %}
    <p class="font-medium text-[#202428]">Формирование файла…</p>
    <progress class="mt-2 h-2 w-full overflow-hidden rounded-full" max="100" value="{{ job.progress }}">{{ job.progress }}%</progress>
    <p class="mt-1 text-sm text-[#5f6873]">{{ job.progress }}%</p>
  {% elif job.status.value == "succeeded" %}
    <p class="font-medium text-[#202428]">Файл готов</p>
    <a
      class="docgen-primary-button mt-2 inline-block"
      href="/projects/{{ job.project_id }}/exports/{{ job.id }}/download"
    >Скачать</a>
  {% elif safe_error %}
    {% set message = safe_error %}
    {% include "export/error.html" %}
    <button
      type="button"
      class="docgen-primary-button mt-2"
      hx-post="/projects/{{ job.project_id }}/export"
      hx-include="#export-form"
      hx-target="#export-result"
      hx-swap="innerHTML"
    >Повторить</button>
  {% else %}
    <p class="font-medium text-[#202428]">Задание отменено</p>
  {% endif %}
</div>
