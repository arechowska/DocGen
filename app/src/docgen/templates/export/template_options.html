<select
  name="template_id"
  {% if not templates %}
    disabled
  {% else %}
    hx-post="/projects/{{ project_id }}/export"
    hx-trigger="load, change"
    hx-include="closest form"
    hx-target="#export-result"
    hx-swap="innerHTML"
  {% endif %}
>
  {% if not templates %}
    <option value="">Нет доступных шаблонов</option>
  {% endif %}
  {% for template in templates %}
    <option value="{{ template.id }}">{{ template.name }}</option>
  {% endfor %}
</select>
