<button
  id="buildButton"
  class="button primary"
  type="submit"
  form="assembleForm"
  data-source-available="{{ 'true' if sources else 'false' }}"
  data-has-document="{{ 'true' if has_document else 'false' }}"
  {% if not sources %}disabled{% endif %}
  {% if build_button_oob | default(false) %}hx-swap-oob="outerHTML"{% endif %}
>
  <span class="button-icon build-icon" aria-hidden="true"></span>
  <span data-build-label>Собрать</span>
</button>
