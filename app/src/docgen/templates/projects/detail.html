{% extends "base.html" %}

{% block content %}
  <main class="mx-auto min-h-screen max-w-4xl px-6 py-12 sm:px-10 lg:py-20">
    <a href="/projects" class="text-sm font-medium text-[#0066cc]">Все документы</a>

    <section class="mt-8 rounded-[28px] bg-white p-7 sm:p-10">
      {% include "projects/name_form.html" %}

      <div class="mt-12 border-t border-[#f5f5f7] pt-8">
        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-sm font-medium text-[#707070]">Материалы</p>
            <h2 class="mt-2 text-2xl font-semibold tracking-tight">Источники</h2>
          </div>
        </div>
        {% include "sources/list.html" %}
      </div>

      {% include "generation/setup.html" %}
    </section>

    <form action="/projects/{{ project.id }}/delete" method="post" hx-delete="/projects/{{ project.id }}" hx-confirm="Удалить документ?" class="mt-6">
      <button class="rounded-full px-5 py-3 text-sm font-medium text-[#0066cc]" type="submit">Удалить документ</button>
    </form>
  </main>
{% endblock %}
