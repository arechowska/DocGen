<form
  action="/projects/{{ project.id }}/rename"
  method="post"
  hx-patch="/projects/{{ project.id }}"
  hx-target="this"
  hx-swap="outerHTML"
  hx-trigger="change delay:500ms"
  class="max-w-2xl"
>
  <label class="text-sm font-medium text-white/80" for="project-name">Название проекта</label>
  <input id="project-name" name="name" value="{{ name | default(project.name) }}" class="mt-3 w-full rounded-2xl bg-white/95 px-5 py-3 text-2xl font-semibold tracking-tight text-[#202428] outline-none ring-white/60 focus:ring-2" type="text">
  {% if error %}
    <p class="mt-3 text-sm text-white" role="alert">{{ error }}</p>
  {% else %}
    <p class="mt-3 text-sm text-white/75">Изменения сохраняются автоматически.</p>
  {% endif %}
</form>
