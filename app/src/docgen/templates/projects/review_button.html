<button
  id="reviewButton"
  class="button secondary"
  type="submit"
  form="checkForm"
  data-template-required
  data-check-available="{% if has_document or check_targets %}true{% else %}false{% endif %}"
  disabled
  {% if review_button_oob | default(false) %}hx-swap-oob="outerHTML"{% endif %}
>
  <span class="button-icon shield-icon" aria-hidden="true"></span>
  <span>Проверить по шаблону</span>
</button>
