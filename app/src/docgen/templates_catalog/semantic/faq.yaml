id: faq
name: FAQ для конечных пользователей Colvir
version: "1.1"
sections:
  - id: general_questions
    title: Общие вопросы
    required: true
    description: Объясняет назначение системы, область применения, роли, права и основные термины.
  - id: getting_started
    title: Начало работы
    required: true
    description: Помогает подготовиться к работе, войти в систему и найти нужную функцию.
  - id: working_with_system
    title: Работа с системой
    required: true
    description: Описывает типовые пользовательские задачи, порядок действий и ожидаемый результат.
  - id: errors_and_limitations
    title: Ошибки и ограничения
    required: true
    description: Объясняет безопасные проверки при ошибках, ограничения операций и случаи обращения к поддержке.
rules:
  - id: faq-structure
    dimension: structure
    severity: error
    instruction: Каждый вопрос размещайте только в одном разделе, а краткий прямой ответ приводите сразу после вопроса.
  - id: faq-procedure-structure
    dimension: structure
    severity: error
    instruction: Для процедурного вопроса указывайте предварительные условия, нумерованные действия и проверяемый результат.
  - id: faq-completeness
    dimension: completeness
    severity: error
    instruction: В каждом разделе раскройте существенные вопросы из источников; не оставляйте пустых разделов, заглушек и ответов без результата.
  - id: faq-grounding
    dimension: completeness
    severity: error
    instruction: Включайте только сведения, подтверждённые актуальными руководствами, настройками, регламентами или релизными материалами для используемой версии.
  - id: faq-terminology
    dimension: terminology
    severity: warning
    instruction: Используйте единые официальные названия экранов, полей, кнопок, статусов и объектов из исходных материалов; при первом употреблении кратко поясняйте термин.
  - id: faq-contradiction
    dimension: contradiction
    severity: error
    instruction: При расхождении источников сначала уточняйте версию, роль и настройку; не объединяйте взаимоисключающие инструкции и помечайте неразрешённое расхождение.
  - id: faq-style
    dimension: style
    severity: warning
    instruction: Пишите спокойным деловым языком, обращайтесь на вы, используйте короткие предложения и одно действие в каждом пункте списка.
  - id: faq-source-visibility
    dimension: style
    severity: error
    instruction: Используйте источники только для внутренней проверки фактов; не показывайте в готовом FAQ ссылки на источники, идентификаторы и служебные комментарии.
style_rules:
  - Формулируйте вопросы так, как их задаёт конечный пользователь, а не как названия разделов руководства.
  - Начинайте ответ с результата или прямого действия; подробности и ограничения размещайте после краткого ответа.
  - Называйте условия доступа, роли, статусы, версии и настройки только если они подтверждены источниками.
  - Не предлагайте повторное проведение, отмену, удаление или обход контрольных проверок без явно подтверждённого безопасного сценария.
  - Если сведений недостаточно, прямо указывайте, что требуется проверка администратором или службой поддержки.
