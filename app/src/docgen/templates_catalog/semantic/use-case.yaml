id: use-case
name: Use Case
version: "2.0"
sections:
  - id: overview
    title: Краткое описание
    required: false
    description: Кратко объясняет назначение сценария, его границы и ожидаемую ценность для бизнеса.
  - id: scope
    title: Область действия
    required: false
    description: Уточняет, какие процессы, продукты, системы и границы входят в сценарий и какие остаются за его пределами.
  - id: goal-level
    title: Уровень цели
    required: false
    description: Показывает уровень цели сценария — пользовательский, бизнесовый или системный — только если это подтверждено источниками.
  - id: primary-actor
    title: Основное действующее лицо
    required: false
    description: Называет роль или систему, которая инициирует сценарий и получает основной результат.
  - id: actor-goal
    title: Цель основного действующего лица
    required: false
    description: Формулирует наблюдаемую цель основного действующего лица без выдуманных мотивов и показателей.
  - id: actors
    title: Участники и интересы
    required: false
    description: Перечисляет участников сценария и их подтверждённые интересы, ответственность или ожидаемую пользу.
  - id: preconditions
    title: Предусловия
    required: true
    description: Описывает условия, доступы, данные и состояния, которые должны быть выполнены до начала сценария.
  - id: minimum-guarantees
    title: Минимальные гарантии
    required: false
    description: Фиксирует состояние или защиту данных, которые должны сохраняться даже при незавершённом сценарии.
  - id: trigger
    title: Инициируется
    required: false
    description: Описывает событие, запрос или условие, запускающее сценарий.
  - id: main-flow
    title: Основной поток
    required: true
    description: Последовательно описывает нормальный путь взаимодействия участников и системы с нумерацией шагов.
  - id: result
    title: Результат
    required: true
    description: Фиксирует проверяемое состояние после успешного завершения основного сценария.
  - id: alternative-flow
    title: Альтернативный вариант
    required: false
    description: Описывает допустимое отклонение от основного потока с точкой ветвления, шагами и способом возврата или завершения.
  - id: exceptions
    title: Исключения
    required: false
    description: Описывает ошибочные или аварийные условия, реакцию системы и безопасное итоговое состояние.
  - id: open-questions
    title: Открытые вопросы
    required: false
    description: Перечисляет только неразрешённые вопросы, неоднозначности и недостающие решения, обнаруженные в источниках.
  - id: terms
    title: Термины и определения
    required: false
    description: Закрепляет официальные термины и краткие определения, использованные в сценарии.
rules:
  - id: use-case-template-form
    dimension: structure
    severity: error
    instruction: Сверьте документ с полной корпоративной формой Use Case; пустые значения допустимы, но отсутствие раздела, таблицы или поля формы является расхождением.
  - id: use-case-structure
    dimension: structure
    severity: error
    instruction: Сформируйте сценарий с участниками, предусловиями, нумерованным основным потоком и проверяемым результатом; дополнительные разделы заполняйте по источникам.
  - id: use-case-flow-branches
    dimension: structure
    severity: error
    instruction: Для каждого альтернативного варианта укажите точку ветвления, условие, нумерованные действия и возврат в основной поток либо отдельное завершение.
  - id: use-case-completeness
    dimension: completeness
    severity: error
    instruction: "Раскройте все подтверждённые части сценария: цель, границы, интересы участников, гарантии, инициирующее событие, варианты, исключения, вопросы и термины."
  - id: use-case-grounding
    dimension: completeness
    severity: error
    instruction: Включайте только сведения из исходных материалов; если часть сценария не описана, создайте gap или открытый вопрос и ничего не выдумывайте.
  - id: use-case-terminology
    dimension: terminology
    severity: warning
    instruction: Используйте единые официальные названия ролей, систем, операций, полей, статусов и бизнес-терминов из источников.
  - id: use-case-contradiction
    dimension: contradiction
    severity: error
    instruction: Альтернативные потоки и исключения не должны противоречить основному потоку, предусловиям, гарантиям и результату; расхождения явно выносите в открытые вопросы.
  - id: use-case-source-conflicts
    dimension: contradiction
    severity: error
    instruction: При конфликте источников не объединяйте несовместимые варианты, а укажите версию, роль или настройку и сохраните нерешённое расхождение.
  - id: use-case-style
    dimension: style
    severity: warning
    instruction: Пишите спокойным деловым языком, используйте наблюдаемые действия, короткие формулировки и один переход состояния в одном шаге.
  - id: use-case-traceability
    dimension: style
    severity: error
    instruction: Каждый фактический раздел и каждый шаг связывайте с точной цитатой источника, не показывая в тексте служебные идентификаторы.
style_rules:
  - Называйте основной сценарий через цель пользователя или бизнес-роли, а не через внутреннюю реализацию.
  - Нумеруйте шаги основного, альтернативного и аварийного потоков отдельно и сохраняйте порядок переходов.
  - Для каждого шага указывайте действие участника и наблюдаемую реакцию системы, если она подтверждена источником.
  - "Разделяйте допустимое альтернативное поведение и исключение: альтернатива сохраняет бизнес-цель, исключение описывает ошибку или безопасное прерывание."
  - Не добавляйте административные поля, диаграммы, тест-кейсы, ссылки и показатели, если они не являются частью текстового сценария из источников.
  - Если данных недостаточно, используйте gap или открытый вопрос вместо правдоподобного предположения.
structure_check:
  rule_id: use-case-template-form
  assembled_section_ids:
    - preconditions
    - main-flow
    - result
  required_headings:
    - Общие сведения
    - Краткое описание
    - Диаграмма деятельности
    - Описание
    - Прототип интерфейса
    - Диаграмма последовательности
    - Тест-кейсы
    - "Приложения: Технические спецификации"
    - Ссылки
    - История изменений
    - Термины и определения
  required_tables:
    - id: metadata
      title: Общие сведения
      required_labels:
        - Код документа
        - Наименование
        - Версия документа
        - Статус документа
        - Модуль
        - Номер задачи ТС
        - Полезность
        - Страна
        - Кастомизация
        - Аналитик
    - id: description
      title: Описание сценария
      required_labels:
        - Область действия
        - Уровень цели
        - Основное действующее лицо
        - Цель основного действующего лица
        - Участники и интересы
        - Предусловия
        - Минимальные гарантии
        - Инициируется
        - Основной сценарий
        - Результат основного сценария
        - Альтернативный вариант
        - Список изменений в технологиях и данных
        - Показатели назначения
        - Открытые вопросы
    - id: technical-specifications
      title: Технические спецификации
      required_labels:
