id: use-case
name: Сценарий использования
version: "1.0"
sections:
  - id: actors
    title: Участники
    required: true
    description: Перечисляет роли, участвующие в сценарии.
  - id: preconditions
    title: Предусловия
    required: true
    description: Описывает условия, которые должны быть выполнены до начала сценария.
  - id: main-flow
    title: Основной поток
    required: true
    description: Последовательно описывает действия участников и системы.
  - id: result
    title: Результат
    required: true
    description: Фиксирует состояние после успешного выполнения сценария.
rules:
  - id: use-case-structure
    dimension: structure
    severity: error
    instruction: Проверьте, что сценарий включает участников, предусловия, основной поток и результат.
  - id: use-case-completeness
    dimension: completeness
    severity: error
    instruction: Проверьте, что в основном потоке описано действие системы после каждого действия участника.
  - id: use-case-terminology
    dimension: terminology
    severity: warning
    instruction: Проверьте, что роли и названия функций совпадают с исходными материалами.
  - id: use-case-contradiction
    dimension: contradiction
    severity: error
    instruction: Проверьте, что предусловия и результат не противоречат шагам основного потока.
  - id: use-case-style
    dimension: style
    severity: warning
    instruction: Проверьте, что шаги сформулированы как наблюдаемые действия без оценочных слов.
style_rules:
  - Нумеруйте шаги основного потока в порядке их выполнения.
